[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# A hashed chunk that no longer exists must 404, not fall through to index.html —
# otherwise the browser tries to parse HTML as a JS module.
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 404

# Single-page app: serve index.html for any other path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # If you self-host Plausible or change the CAPTCHA provider, update the
    # matching hosts below (script-src / frame-src / connect-src).
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com https://plausible.io; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.mymemory.translated.net https://plausible.io; worker-src 'self' blob:"
